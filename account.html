<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | آوین فارما</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 18px}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}</style></head><body><h1>حساب من</h1><div class="card"><a href="/checkout.html">تکمیل سفارش</a></div><div class="card"><h2>سفارش‌های من</h2><div id="orders">در حال بارگذاری...</div></div><script>
const t=localStorage.getItem("avin_session"); fetch("/api/me/orders",{headers:t?{"Authorization":"Bearer "+t}:{}}).then(r=>r.json()).then(d=>document.querySelector("#orders").innerHTML=(d.items||[]).map(o=>`<div>${o.order_no} — ${o.status} — ${o.total}</div>`).join("")||"سفارشی ندارید");
</script></body></html>

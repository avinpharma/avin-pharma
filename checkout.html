<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تکمیل سفارش | آوین فارما</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 18px}section{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}button{padding:12px 20px;border:0;border-radius:10px;cursor:pointer}.muted{color:#666}</style></head>
<body><h1>تکمیل سفارش</h1><p class="muted">فقط مکمل، آرایشی‌بهداشتی و تجهیزات پزشکی</p>
<section><h2>آدرس تحویل</h2><div id="addresses">برای نمایش آدرس‌ها وارد حساب شوید.</div></section>
<section><h2>خلاصه سفارش</h2><div id="summary">سبد خرید شما</div><button id="pay">ادامه و پرداخت</button></section>
<script>
const token=localStorage.getItem("avin_session");
const headers=token?{"Authorization":"Bearer "+token}:{}; 
async function load(){if(!token)return;
 const r=await fetch("/api/me/addresses",{headers}); const d=await r.json();
 document.querySelector("#addresses").innerHTML=(d.items||[]).map(a=>`<label><input type="radio" name="address" value="${a.id}" ${a.is_default?"checked":""}> ${a.title} — ${a.recipient} — ${a.address}</label>`).join("<br>")||"آدرسی ثبت نشده است.";
}
load();
document.querySelector("#pay").onclick=()=>alert("مرحله بعد: ارسال سفارش به API و ایجاد تراکنش پرداخت امن.");
</script></body></html>
